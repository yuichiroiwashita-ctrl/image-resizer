name: PR Review

# full-auto ティア用テンプレート。
# コピー先: 各リポジトリの .github/workflows/pr-review.yml
# 事前準備: リポジトリに Secrets `CLAUDE_CODE_OAUTH_TOKEN` を設定し、
#           リポジトリ設定で "Allow auto-merge" を有効化しておくこと。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: yuichiroiwashita-ctrl/gha-shared-workflows/.github/workflows/claude-pr-review.yml@main
    with:
      auto_merge: true
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
